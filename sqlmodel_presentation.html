<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLModel — Quand Pydantic et SQLAlchemy ne font qu'un</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141c; --bg-2:#0d0f16; --surface:#1b1e2b; --surface-2:#232739; --border:#2b2f43;
  --text:#e9eaf2; --text-dim:#a0a6bc;
  --pydantic:#e1306c; --sqlalchemy:#3e8fc4; --fusion:#f2b84b; --ok:#5cc28a;
  --radius:14px;
}
@media (prefers-color-scheme: light){
  :root.auto-light{}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',system-ui,sans-serif;overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:500;margin:0;letter-spacing:-0.01em}
code,.mono,pre,textarea{font-family:'IBM Plex Mono',ui-monospace,monospace}
em{color:var(--text)}
#deck{position:relative;height:100%;width:100%}
.slide{position:absolute;inset:0;padding:5vh 6vw 96px;opacity:0;transform:translateX(36px);pointer-events:none;visibility:hidden;transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
.slide.active{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity .45s ease,transform .45s ease}
.slide.past{transform:translateX(-36px)}
.inner{max-width:1180px;margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:center;overflow-y:auto;padding:4px 2px}
.eyebrow{color:var(--fusion);font-size:.78rem;font-weight:600;letter-spacing:.08em;margin-bottom:.8rem;text-transform:uppercase}
h2.t{font-size:clamp(1.7rem,3.2vw,2.7rem);margin-bottom:1rem;line-height:1.12}
p.l{font-size:clamp(.95rem,1.25vw,1.08rem);line-height:1.65;color:var(--text-dim);margin:0 0 .9rem;max-width:62ch}
p.l strong{color:var(--text)}
.mono-i{font-family:'IBM Plex Mono',monospace;font-size:.92em;color:var(--fusion)}
#progress{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--pydantic),var(--sqlalchemy),var(--fusion));transition:width .4s ease;z-index:50}
#count{position:fixed;top:16px;right:24px;font:500 .75rem 'IBM Plex Mono',monospace;color:var(--text-dim);z-index:50}
#nav{position:fixed;bottom:20px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:12px;z-index:50}
.nb{background:var(--surface);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.nb:hover{background:var(--surface-2)}
#dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:60vw}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);border:0;padding:0;cursor:pointer}
.dot.active{background:var(--fusion);transform:scale(1.5)}
.dot.done{background:var(--ok)}
:focus-visible{outline:2px solid var(--fusion);outline-offset:2px}
.win{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 50px -22px rgba(0,0,0,.65)}
.win .bar{display:flex;align-items:center;gap:6px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
.win .bar i{width:9px;height:9px;border-radius:50%;display:block}
.win .bar span{margin-left:8px;font:.72rem 'IBM Plex Mono',monospace;color:var(--text-dim)}
.win pre{margin:0;padding:16px 18px;font-size:clamp(.74rem,1vw,.86rem);line-height:1.65;overflow-x:auto;color:#d7dbe8}
.k{color:var(--fusion)}.s{color:var(--pydantic)}.b{color:var(--sqlalchemy)}.c{color:#6d748c;font-style:italic}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.2rem,3vw,3rem);align-items:center}
.split.top{align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}.slide{padding:4vh 5vw 96px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.3rem 1.5rem}
.card h3{font-size:1.1rem;margin-bottom:.5rem}
.badges{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.badge{font-size:.74rem;padding:5px 11px;border-radius:999px;border:1px solid var(--border);color:var(--text-dim)}
table.cmp{width:100%;border-collapse:collapse;font-size:.9rem}
table.cmp th,table.cmp td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.cmp th{font:500 .7rem 'IBM Plex Mono',monospace;color:var(--text-dim);text-transform:uppercase}
.no{color:var(--pydantic)}.yes{color:var(--fusion)}
.toggle{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:1rem}
.toggle button{background:var(--surface);color:var(--text-dim);border:0;padding:9px 16px;font:500 .85rem 'IBM Plex Mono',monospace;cursor:pointer}
.toggle button.on{background:var(--fusion);color:#171410}
.res{list-style:none;padding:0;margin:0;font-size:.92rem}
.res li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);color:var(--text-dim)}
.res li b{min-width:1.2em}
.opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;font:inherit;font-size:.92rem}
.opt:hover:not([disabled]){border-color:var(--fusion)}
.opt.correct{border-color:var(--ok);background:rgba(92,194,138,.13)}
.opt.wrong{border-color:var(--pydantic);background:rgba(225,48,108,.13)}
.fb{display:none;margin-top:10px;font-size:.88rem;color:var(--text-dim);line-height:1.55}.fb.show{display:block}
.btn{background:var(--fusion);color:#171410;border:0;padding:9px 16px;border-radius:9px;font:600 .85rem 'IBM Plex Sans',sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn:hover{filter:brightness(1.08)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.8rem}
textarea.ed{display:block;width:100%;min-height:clamp(180px,32vh,300px);background:var(--bg-2);color:#d7dbe8;border:0;padding:14px 16px;font-size:clamp(.74rem,1vw,.86rem);line-height:1.6;resize:vertical;tab-size:4}
textarea.ed:focus{outline:none}
.verdict{margin-top:.8rem;font-size:.9rem;line-height:1.55;padding:.8rem 1rem;border-radius:10px;display:none}
.verdict.ok{display:block;background:rgba(92,194,138,.13);border:1px solid var(--ok);color:var(--text)}
.verdict.ko{display:block;background:rgba(225,48,108,.1);border:1px solid var(--pydantic);color:var(--text)}
.verdict ul{margin:.4rem 0 0;padding-left:1.1rem}
.hint,.sol{display:none;margin-top:.8rem}.hint.show,.sol.show{display:block}
.hint{font-size:.9rem;color:var(--text-dim);line-height:1.55;border-left:3px solid var(--fusion);padding-left:12px}
.stars{color:var(--fusion);letter-spacing:2px;font-size:.9rem}
.note{font-size:.75rem;color:var(--text-dim);margin-top:.6rem}
.tree text{font-family:'IBM Plex Mono',monospace}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-top:1rem}
.score div{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.9rem 1rem;font-size:.88rem;color:var(--text-dim)}
.score div.ok{border-color:var(--ok);color:var(--text)}
.agenda{list-style:none;padding:0;margin:0;counter-reset:a;display:grid;grid-template-columns:1fr 1fr;gap:.6rem 2rem}
.agenda li{counter-increment:a;padding:.7rem 0;border-bottom:1px solid var(--border);font-size:1rem;cursor:pointer}
.agenda li::before{content:counter(a,decimal-leading-zero);font:500 .78rem 'IBM Plex Mono',monospace;color:var(--fusion);margin-right:.9rem}
.agenda li:hover{color:var(--fusion)}
@media(max-width:700px){.agenda{grid-template-columns:1fr}}
@media print{body{overflow:visible}.slide{position:static;opacity:1;visibility:visible;transform:none;page-break-after:always;height:auto}#nav,#progress,#count{display:none}}
</style>
</head>
<body>
<div id="progress"></div><div id="count"></div><div id="deck"></div>
<div id="nav"><button class="nb" id="prev" aria-label="Précédent">‹</button><div id="dots"></div><button class="nb" id="next" aria-label="Suivant">›</button></div>
<script>
/* ===== EXERCISES (données + vérificateur) ===== */
const EXO = [
{ n:1, stars:1, title:"Un schéma pur, sans table",
  task:`Créez une classe <span class="mono-i">TagRead</span> qui sert uniquement à valider des données d'API — <strong>pas</strong> une table. Un seul champ : <span class="mono-i">name: str</span>.`,
  hint:`Une classe qui n'est pas une table n'a pas l'argument <span class="mono-i">table=True</span>. Elle hérite simplement de <span class="mono-i">SQLModel</span>.`,
  starter:`# Exercice 1 — TagRead (schéma pur, pas de table)\n# Écrivez votre code ci-dessous\n\n`,
  solution:`class TagRead(SQLModel):\n    name: str\n`,
  rules:[
    [/class\s+TagRead\s*\(\s*SQLModel\s*\)\s*:/, "La classe doit s'appeler TagRead et hériter de SQLModel — sans table=True."],
    [/name\s*:\s*str\b/, "Il manque le champ name: str."]
  ]},
{ n:2, stars:2, title:"Votre première vraie table",
  task:`Créez <span class="mono-i">Category</span>, une <strong>vraie table</strong> : <span class="mono-i">id</span> (entier optionnel, clé primaire, <span class="mono-i">None</span> par défaut) et <span class="mono-i">name: str</span>.`,
  hint:`Regardez <span class="mono-i">User</span> et <span class="mono-i">Hero</span> dans la présentation : l'argument de classe qui crée la table, et <span class="mono-i">Field(...)</span> pour la clé primaire.`,
  starter:`# Exercice 2 — Category (vraie table)\n# Écrivez votre code ci-dessous\n\n`,
  solution:`class Category(SQLModel, table=True):\n    id: int | None = Field(default=None, primary_key=True)\n    name: str\n`,
  rules:[
    [/class\s+Category\s*\(\s*SQLModel\s*,\s*table\s*=\s*True\s*\)\s*:/, "Category doit être une table : class Category(SQLModel, table=True)."],
    [/id\s*:\s*(int\s*\|\s*None|Optional\[int\])\s*=\s*Field\(/, "id doit être optionnel (int | None) et défini avec Field(...)."],
    [/primary_key\s*=\s*True/, "id doit être la clé primaire : primary_key=True."],
    [/default\s*=\s*None/, "La clé primaire doit valoir None par défaut : default=None."],
    [/name\s*:\s*str\b/, "Il manque le champ name: str."]
  ]},
{ n:3, stars:3, title:"Un champ optionnel",
  task:`Reprenez <span class="mono-i">Category</span> et ajoutez un champ <span class="mono-i">description</span> de type texte, <strong>optionnel</strong>, qui vaut <span class="mono-i">None</span> si rien n'est fourni.`,
  hint:`Un champ optionnel typé s'écrit avec <span class="mono-i">| None</span> suivi d'une valeur par défaut. Pas besoin de <span class="mono-i">Field()</span> ici.`,
  starter:`# Exercice 3 — Category avec une description optionnelle\n# Réécrivez Category en entier\n\n`,
  solution:`class Category(SQLModel, table=True):\n    id: int | None = Field(default=None, primary_key=True)\n    name: str\n    description: str | None = None\n`,
  rules:[
    [/class\s+Category\s*\(\s*SQLModel\s*,\s*table\s*=\s*True\s*\)\s*:/, "Gardez Category comme table (table=True)."],
    [/primary_key\s*=\s*True/, "N'oubliez pas la clé primaire id."],
    [/name\s*:\s*str\b/, "N'oubliez pas name: str."],
    [/description\s*:\s*(str\s*\|\s*None|Optional\[str\])\s*=\s*None/, "description doit être optionnelle : description: str | None = None."]
  ]},
{ n:4, stars:3, title:"Refactoring, et un piège",
  task:`Ancien code : <span class="mono-i">Product(Base)</span> en SQLAlchemy + <span class="mono-i">ProductCreate(BaseModel)</span> en Pydantic. Créez <span class="mono-i">Product</span> (table : <span class="mono-i">id</span>, <span class="mono-i">name</span>, <span class="mono-i">price: float</span>) <strong>et</strong> <span class="mono-i">ProductCreate</span> (sans table : <span class="mono-i">name</span>, <span class="mono-i">price</span> strictement positif).`,
  hint:`Cherchez un paramètre de <span class="mono-i">Field()</span> qui signifie « greater than ». Et testez : <span class="mono-i">Product(name="x", price=-10)</span> ne lève <em>aucune</em> erreur, car une classe avec table n'est pas validée à la création. La contrainte n'a donc de sens que sur le schéma sans table.`,
  starter:`# Exercice 4 — Product (table) + ProductCreate (schéma d'entrée)\n# Écrivez votre code ci-dessous\n\n`,
  solution:`class Product(SQLModel, table=True):\n    id: int | None = Field(default=None, primary_key=True)\n    name: str\n    price: float\n\nclass ProductCreate(SQLModel):\n    name: str\n    price: float = Field(gt=0)\n`,
  rules:[
    [/class\s+Product\s*\(\s*SQLModel\s*,\s*table\s*=\s*True\s*\)\s*:/, "Product doit être une table : class Product(SQLModel, table=True)."],
    [/primary_key\s*=\s*True/, "Product a besoin d'une clé primaire id."],
    [/class\s+ProductCreate\s*\(\s*SQLModel\s*\)\s*:/, "ProductCreate doit hériter de SQLModel, sans table=True."],
    [/price\s*:\s*float\s*=\s*Field\(\s*gt\s*=\s*0\s*\)/, "Sur ProductCreate, price doit être : price: float = Field(gt=0)."]
  ]},
{ n:5, stars:4, title:"La hiérarchie complète",
  task:`Construisez le motif <span class="mono-i">Base / table / Create / Public</span> pour <span class="mono-i">Book</span> : <span class="mono-i">BookBase</span> (title, author), <span class="mono-i">Book</span> (table : + id, isbn), <span class="mono-i">BookCreate</span> (+ isbn), <span class="mono-i">BookPublic</span> (+ id).`,
  hint:`Quatre classes, une seule avec <span class="mono-i">table=True</span>. Les trois autres héritent de <span class="mono-i">BookBase</span> sans réécrire <span class="mono-i">title</span> ni <span class="mono-i">author</span>.`,
  starter:`# Exercice 5 — BookBase, Book, BookCreate, BookPublic\n# Écrivez votre code ci-dessous\n\n`,
  solution:`class BookBase(SQLModel):\n    title: str\n    author: str\n\nclass Book(BookBase, table=True):\n    id: int | None = Field(default=None, primary_key=True)\n    isbn: str\n\nclass BookCreate(BookBase):\n    isbn: str\n\nclass BookPublic(BookBase):\n    id: int\n`,
  rules:[
    [/class\s+BookBase\s*\(\s*SQLModel\s*\)\s*:/, "BookBase doit hériter de SQLModel (sans table=True)."],
    [/title\s*:\s*str\b/, "Il manque title: str dans BookBase."],
    [/author\s*:\s*str\b/, "Il manque author: str dans BookBase."],
    [/class\s+Book\s*\(\s*BookBase\s*,\s*table\s*=\s*True\s*\)\s*:/, "Book doit hériter de BookBase avec table=True."],
    [/isbn\s*:\s*str\b/, "Il manque isbn: str."],
    [/class\s+BookCreate\s*\(\s*BookBase\s*\)\s*:/, "BookCreate doit hériter de BookBase."],
    [/class\s+BookPublic\s*\(\s*BookBase\s*\)\s*:/, "BookPublic doit hériter de BookBase."],
    [/class\s+BookPublic\s*\(\s*BookBase\s*\)\s*:\s*id\s*:\s*int\b/, "BookPublic doit ajouter id: int."]
  ]},
{ n:6, stars:5, title:"Une relation entre deux tables",
  task:`Créez <span class="mono-i">Author</span> (id, name) et <span class="mono-i">Novel</span> (id, title, référence vers son auteur). Un auteur a plusieurs romans : <span class="mono-i">Novel(title="Fondation", author=auteur)</span> doit fonctionner dans les deux sens.`,
  hint:`Il faut sur <span class="mono-i">Novel</span> une <strong>clé étrangère</strong> (paramètre <span class="mono-i">foreign_key</span> de <span class="mono-i">Field</span>, la table s'appelle <span class="mono-i">author</span> par défaut) et une <strong>relation ORM</strong> (<span class="mono-i">Relationship</span> avec <span class="mono-i">back_populates</span>). Déclarez aussi la relation côté <span class="mono-i">Author</span>, dans l'autre sens.`,
  starter:`# Exercice 6 — Author et Novel liés\n# Écrivez votre code ci-dessous\n\n`,
  solution:`class Author(SQLModel, table=True):\n    id: int | None = Field(default=None, primary_key=True)\n    name: str\n    novels: list["Novel"] = Relationship(back_populates="author")\n\nclass Novel(SQLModel, table=True):\n    id: int | None = Field(default=None, primary_key=True)\n    title: str\n    author_id: int | None = Field(default=None, foreign_key="author.id")\n    author: Author | None = Relationship(back_populates="novels")\n`,
  rules:[
    [/class\s+Author\s*\(\s*SQLModel\s*,\s*table\s*=\s*True\s*\)\s*:/, "Author doit être une table."],
    [/class\s+Novel\s*\(\s*SQLModel\s*,\s*table\s*=\s*True\s*\)\s*:/, "Novel doit être une table."],
    [/author_id\s*:\s*(int\s*\|\s*None|Optional\[int\])\s*=\s*Field\(/, "Il manque author_id: int | None = Field(...) sur Novel."],
    [/foreign_key\s*=\s*["']author\.id["']/, "La clé étrangère doit viser author.id : foreign_key=\"author.id\"."],
    [/novels\s*:\s*(list|List)\s*\[/, "Author doit avoir un attribut novels de type list[...]."],
    [/Relationship\s*\(\s*back_populates\s*=\s*["']author["']\s*\)/, "Il manque la relation côté Author : Relationship(back_populates=\"author\")."],
    [/Relationship\s*\(\s*back_populates\s*=\s*["']novels["']\s*\)/, "Il manque la relation côté Novel : Relationship(back_populates=\"novels\")."]
  ]}
];

function normalizeCode(src){
  return src.split("\n").map(l=>l.replace(/#.*$/,"")).join("\n").replace(/\s+/g," ").trim();
}
function checkExo(i, src){
  const code = normalizeCode(src);
  if(!code) return ["Le champ est vide : écrivez votre code."];
  return EXO[i].rules.filter(r=>!r[0].test(code)).map(r=>r[1]);
}
/* ===== END EXERCISES ===== */
/* ===== helpers ===== */
const WIN = (name, body) => `<div class="win"><div class="bar"><i style="background:#e0685c"></i><i style="background:#e0b95c"></i><i style="background:#5cc26a"></i><span>${name}</span></div><pre>${body}</pre></div>`;
function mergeSVG(w,h,small){
  const m=h/2,x=w*0.52,sw=small?3:4;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="Pydantic et SQLAlchemy fusionnent en SQLModel">
  <path d="M${w*.04},${h*.26} C${w*.32},${h*.26} ${w*.4},${m} ${x},${m}" fill="none" stroke="var(--pydantic)" stroke-width="${sw}" stroke-linecap="round"/>
  <path d="M${w*.04},${h*.74} C${w*.32},${h*.74} ${w*.4},${m} ${x},${m}" fill="none" stroke="var(--sqlalchemy)" stroke-width="${sw}" stroke-linecap="round"/>
  <path d="M${x},${m} L${w*.96},${m}" fill="none" stroke="var(--fusion)" stroke-width="${sw+1}" stroke-linecap="round"/>
  <circle cx="${w*.04}" cy="${h*.26}" r="5" fill="var(--pydantic)"/><circle cx="${w*.04}" cy="${h*.74}" r="5" fill="var(--sqlalchemy)"/><circle cx="${w*.96}" cy="${m}" r="6" fill="var(--fusion)"/>
  ${small?'':`<text x="${w*.05}" y="${h*.26-12}" fill="var(--pydantic)" font-size="13">Pydantic</text><text x="${w*.05}" y="${h*.74+24}" fill="var(--sqlalchemy)" font-size="13">SQLAlchemy</text><text x="${w*.8}" y="${m-14}" fill="var(--fusion)" font-size="13">SQLModel</text>`}</svg>`;
}
const stars = n => "★".repeat(n)+"☆".repeat(5-n);

const slides = [];

/* 1 Titre */
slides.push({title:"Titre", html:`<div class="inner">
  <div class="eyebrow">Recherche &amp; présentation technique</div>
  <h1 style="font-size:clamp(2.8rem,8vw,5.4rem);line-height:1">SQLModel</h1>
  <p class="l" style="font-size:clamp(1.1rem,2vw,1.4rem);color:var(--text);margin-top:.8rem">Quand Pydantic et SQLAlchemy<br>ne font plus qu'un.</p>
  <div style="margin:2rem 0 1.2rem">${mergeSVG(520,150)}</div>
  <p class="l">Une seule classe Python pour valider vos données <em>et</em> définir votre table en base.</p>
  <div class="badges"><span class="badge">FastAPI</span><span class="badge">Pydantic</span><span class="badge">SQLAlchemy</span><span class="badge">Type hints</span></div>
</div>`});

/* 2 Sommaire */
slides.push({title:"Sommaire", html:`<div class="inner">
  <div class="eyebrow">Au programme</div><h2 class="t">Ce que nous allons voir</h2>
  <ol class="agenda">
    <li data-go="2">Le problème : deux modèles pour une même idée</li>
    <li data-go="4">La solution : une classe, deux rôles</li>
    <li data-go="5">Le rôle de <span class="mono-i">table=True</span></li>
    <li data-go="6">L'héritage : un modèle par usage</li>
    <li data-go="7">Un piège à connaître sur la validation</li>
    <li data-go="8">Relier deux tables</li>
    <li data-go="10">QCM + 6 exercices à coder</li>
    <li data-go="18">Bilan</li>
  </ol></div>`});

/* 3 Deux mondes */
slides.push({title:"Deux mondes", html:`<div class="inner"><div class="eyebrow">Le problème</div><h2 class="t">Deux mondes qui ne se parlent pas</h2>
 <div class="split"><div>
  <p class="l">Une API FastAPI branchée sur une base SQL demande classiquement deux outils, avec chacun son langage de modèle :</p>

slides.push({title:"Piège", html:`<div class="inner"><div class="eyebrow">À connaître</div><h2 class="t">Le piège : la validation sur une table</h2>

  <p class="l">C'est une raison de plus pour garder un schéma séparé (<span class="mono-i">ProductCreate</span>) qui valide les données de l'API <em>avant</em> de construire l'objet de table.</p>

    price: float = Field(gt=<span class="k">0</span>)

<span class="k">class</span> ProductCreate(SQLModel):

/* ===== rendu ===== */
const deck=document.getElementById('deck'), dots=document.getElementById('dots');
slides.forEach((s,i)=>{
  const d=document.createElement('section'); d.className='slide'; d.setAttribute('aria-label',s.title); d.innerHTML=s.html; deck.appendChild(d);
  const b=document.createElement('button'); b.className='dot'; b.setAttribute('aria-label',(i+1)+' — '+s.title); b.title=s.title; b.onclick=()=>go(i); dots.appendChild(b);
});
const els=[...document.querySelectorAll('.slide')], dEls=[...document.querySelectorAll('.dot')];
let cur=0;
/* progression sauvegardée (facultatif) */
let done={};
try{ done=JSON.parse(localStorage.getItem('sqlmodel_done')||'{}'); }catch(e){}
function saveDone(){ try{ localStorage.setItem('sqlmodel_done',JSON.stringify(done)); }catch(e){} }
function paint(){
  els.forEach((el,i)=>{ el.classList.toggle('active',i===cur); el.classList.toggle('past',i<cur); });
  dEls.forEach((el,i)=>{ el.classList.toggle('active',i===cur); const ex=slides[i].ex; el.classList.toggle('done',ex!==undefined&&!!done[ex]); });
  document.getElementById('progress').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('count').textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(slides[cur].bilan) renderScore();
}
function go(i){ cur=Math.max(0,Math.min(slides.length-1,i)); paint(); try{history.replaceState(null,'','#'+(cur+1));}catch(e){} }
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
  const t=e.target.tagName; if(t==='TEXTAREA'||t==='INPUT') return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(cur+1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
  else if(e.key==='Home')go(0); else if(e.key==='End')go(slides.length-1);
  else if(e.key==='f'||e.key==='F'){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
});
let tx=null;
document.addEventListener('touchstart',e=>{ if(e.target.tagName==='TEXTAREA') return; tx=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>60) go(cur+(dx<0?1:-1)); tx=null; });

/* ===== clics délégués ===== */
deck.addEventListener('click',e=>{
  const t=e.target;
  if(t.dataset.tt!==undefined) return showTT(+t.dataset.tt);
  const li=t.closest('[data-go]'); if(li) return go(+li.dataset.go);
  if(t.classList.contains('opt')){
    const q=t.closest('.quiz'); if(!q||q.dataset.done) return; q.dataset.done=1;
    const ok=+q.dataset.ok;
    [...q.children].forEach((o,i)=>{ o.disabled=true; if(i===ok)o.classList.add('correct'); else if(o===t)o.classList.add('wrong'); });
    q.parentElement.querySelector('.fb').classList.add('show'); return;
  }
  const act=t.dataset.act; if(!act) return;
  const i=+t.dataset.i;
  if(act==='hint') document.getElementById('hint'+i).classList.toggle('show');
  if(act==='sol'){ const s=document.getElementById('sol'+i); s.classList.toggle('show'); t.textContent=s.classList.contains('show')?'Masquer la solution':'Solution'; }
  if(act==='check'){
    const v=document.getElementById('verdict'+i), errs=checkExo(i,document.getElementById('ed'+i).value);
    if(!errs.length){ v.className='verdict ok'; v.innerHTML='<strong>Bravo !</strong> Votre code respecte tout ce qui est demandé. Vérifiez-le aussi avec pytest pour un test réel.'; done[i]=true; saveDone(); paint(); }
    else{ v.className='verdict ko'; v.innerHTML='<strong>Pas encore.</strong><ul>'+errs.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
  }
});
/* Tab = 4 espaces dans les éditeurs */
deck.addEventListener('keydown',e=>{
  if(e.target.classList&&e.target.classList.contains('ed')&&e.key==='Tab'){
    e.preventDefault(); const a=e.target, s=a.selectionStart;
    a.value=a.value.slice(0,s)+'    '+a.value.slice(a.selectionEnd); a.selectionStart=a.selectionEnd=s+4;
  }
});
